<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capability Dashboard</title>
<style>
  :root {
    --bg:#0f1419; --panel:#161d26; --line:#2a3441; --text:#e6e6e6; --muted:#7d8b9a;
    --accent:#6fb3f2; --ok:#7ee2a8; --warn:#ffd97a; --bad:#ff9b9b;
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         background:var(--bg); color:var(--text); }
  header { background:#1a2332; border-bottom:1px solid var(--line); padding:12px 20px;
           display:flex; align-items:center; gap:14px; }
  header h1 { margin:0; font-size:15px; font-weight:600; }
  header .muted { color:var(--muted); font-weight:400; }
  #bell { margin-left:auto; background:#3a2a12; color:var(--warn); border:1px solid #6b4d1a;
          padding:5px 12px; border-radius:14px; font-size:12px; font-weight:600; display:none;
          cursor:pointer; }
  main { flex:1; display:flex; min-height:0; }

  /* ---- catalog ---- */
  #catalog { width:330px; border-right:1px solid var(--line); overflow-y:auto; padding:14px; }
  .cap { background:var(--panel); border:1px solid var(--line); border-radius:6px;
         padding:11px 13px; margin-bottom:9px; cursor:pointer; }
  .cap:hover { border-color:var(--accent); }
  .cap h3 { margin:0 0 3px; font-size:13px; font-weight:600; }
  .cap .id { color:var(--muted); font-size:11px; font-family:ui-monospace,monospace; }
  .tags { margin-top:7px; display:flex; gap:5px; flex-wrap:wrap; }
  .tag { font-size:10px; padding:2px 7px; border-radius:9px; font-weight:600;
         text-transform:uppercase; letter-spacing:.4px; background:#243040; color:var(--muted); }
  .tag.approved { background:#1e4d33; color:var(--ok); }
  .tag.draft    { background:#4a3a12; color:var(--warn); }
  .tag.stable   { background:#1e4d33; color:var(--ok); }
  .tag.degraded, .tag.flaky { background:#4d1e1e; color:var(--bad); }
  .tag.irreversible { background:#4d2a1e; color:#ffb38a; }

  /* ---- chat ---- */
  #chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  #messages { flex:1; overflow-y:auto; padding:18px 22px; }
  .msg { margin-bottom:16px; max-width:760px; }
  .msg .who { font-size:11px; color:var(--muted); text-transform:uppercase;
              letter-spacing:.5px; margin-bottom:4px; }
  .msg .body { white-space:pre-wrap; }
  .msg.user .body { background:#1c2c3f; padding:9px 13px; border-radius:8px; display:inline-block; }
  .msg.system .body { color:var(--muted); font-style:italic; }
  .refs { margin-top:7px; font-size:11px; color:var(--muted); font-family:ui-monospace,monospace; }
  .refs a { color:var(--accent); text-decoration:none; margin-right:12px; cursor:pointer; }
  #composer { border-top:1px solid var(--line); padding:12px 18px; display:flex; gap:9px; }
  #composer input { flex:1; background:var(--panel); border:1px solid var(--line);
                    color:var(--text); padding:10px 13px; border-radius:6px; font:inherit; }
  button { font:inherit; font-weight:600; border:none; border-radius:6px; padding:10px 18px;
           cursor:pointer; background:var(--accent); color:#0f1419; }
  button.ghost { background:#243040; color:var(--text); }
  button:disabled { opacity:.5; cursor:default; }

  /* ---- drawer + modal ---- */
  #drawer { position:fixed; top:0; right:0; width:min(720px,90vw); height:100vh;
            background:var(--panel); border-left:1px solid var(--line); padding:20px;
            overflow-y:auto; transform:translateX(100%); transition:transform .18s; z-index:20; }
  #drawer.open { transform:translateX(0); }
  #drawer pre { white-space:pre-wrap; font:12px/1.55 ui-monospace,monospace; }
  .backdrop { position:fixed; inset:0; background:#0009; display:none; z-index:15; }
  .backdrop.open { display:block; }
  #modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:30; }
  #modal.open { display:flex; }
  #modal .card { background:var(--panel); border:1px solid #6b4d1a; border-radius:8px;
                 width:min(680px,92vw); max-height:88vh; overflow-y:auto; padding:22px; }
  #modal h2 { margin:0 0 4px; font-size:16px; }
  .reason { background:#2d1f1f; border-left:3px solid #d05656; padding:10px 14px;
            border-radius:3px; margin:14px 0; }
  table.kv { width:100%; border-collapse:collapse; font-size:13px; margin:10px 0; }
  table.kv td { padding:4px 0; vertical-align:top; }
  table.kv td:first-child { color:var(--muted); width:140px; }
  img.shot { max-width:100%; border:1px solid var(--line); border-radius:4px; margin-top:10px; }
  code { background:#0f1419; padding:1px 5px; border-radius:3px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Capability Dashboard <span class="muted">— interface.ai computer-use automation</span></h1>
  <button id="bell">1 intervention needs you</button>
</header>

<main>
  <aside id="catalog"></aside>
  <section id="chat">
    <div id="messages"></div>
    <form id="composer">
      <input id="input" autocomplete="off"
             placeholder="e.g. what is the savings balance for member 100442?">
      <button id="send" type="submit">Send</button>
      <button id="newchat" type="button" class="ghost">New</button>
    </form>
  </section>
</main>

<div class="backdrop" id="backdrop"></div>
<div id="drawer"></div>
<div id="modal"><div class="card" id="modalCard"></div></div>

<script type="module" src="/app.js"></script>
</body>
</html>
